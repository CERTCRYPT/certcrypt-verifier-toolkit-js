# CI for certcrypt-verifier-toolkit-js — the reference offline verifier.
#
# The conformance contract is NOT vendored here: it lives in certcrypt-conformance
# and is checked out as a sibling below. The harness resolves it from
# CERTCRYPT_CONFORMANCE_DIR or from a sibling checkout, and FAILS if the fixture
# tree is absent or incomplete — a partial contract cannot produce an attestation.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json `engines`, and current LTS. The floor
        # is what an integrator may actually be running; testing only the newest
        # would let a syntax or API assumption past that breaks it.
        node: ["20", "22"]

    steps:
      - name: Check out the toolkit
        uses: actions/checkout@v4
        with:
          path: certcrypt-verifier-toolkit-js

      - name: Check out the conformance contract
        uses: actions/checkout@v4
        with:
          repository: CERTCRYPT/certcrypt-conformance
          path: certcrypt-conformance

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: certcrypt-verifier-toolkit-js/package-lock.json

      - name: Install
        working-directory: certcrypt-verifier-toolkit-js
        # `npm ci` rather than `npm install`: it installs exactly the lockfile and
        # fails if package.json and the lock disagree.
        run: npm ci

      - name: Typecheck
        working-directory: certcrypt-verifier-toolkit-js
        run: npm run lint

      - name: Build
        working-directory: certcrypt-verifier-toolkit-js
        run: npm run build

      - name: Unit tests (node backend)
        working-directory: certcrypt-verifier-toolkit-js
        run: npm test

      - name: Unit tests (web backend)
        working-directory: certcrypt-verifier-toolkit-js
        # Same public surface, different crypto provider. The browser path is
        # audited rather than assumed, so both backends run the same suite.
        run: npm run test:web

      - name: Conformance suite (node backend)
        working-directory: certcrypt-verifier-toolkit-js
        env:
          CERTCRYPT_CONFORMANCE_DIR: ${{ github.workspace }}/certcrypt-conformance/fixtures
        run: npm run test:conformance

      - name: Conformance suite (web backend)
        working-directory: certcrypt-verifier-toolkit-js
        env:
          CERTCRYPT_CONFORMANCE_DIR: ${{ github.workspace }}/certcrypt-conformance/fixtures
        run: npm run test:conformance:web

      - name: The published package carries no test material
        working-directory: certcrypt-verifier-toolkit-js
        # `files` in package.json is what actually decides the tarball. A stray
        # test or harness profile shipping to consumers is a packaging defect that
        # no test catches, because every test passes either way.
        run: |
          leaked=$(npm pack --dry-run --json \
            | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"))[0];
                       console.log(d.files.map(f=>f.path)
                         .filter(p=>/\.test\.|(^|\/)harness\//.test(p)).join("\n"))')
          if [ -n "$leaked" ]; then
            echo "::error::Test material would be published:"; echo "$leaked"; exit 1
          fi
